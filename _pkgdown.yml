url: https://gregorlueg.github.io/bixverse.plots/

template:
  bootstrap: 5
  light-switch: true
  theme: atom-one-light
  theme-dark: atom-one-dark
  bslib:
    primary: "#3C4B6D"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem

home:
  title: "bixverse.plots"
  description: "Plotting helpers for bixverse"
navbar:
  structure:
    left: [intro, reference, news, articles]
    right: [search, lightswitch, github]
  components:
    articles:
      text: Articles
      menu:
        - text: "Gene set enrichment"
        - text: Visualising GSEA results
          href: articles/gsea_visualisation.html
        - text: Visualising over-representation results
          href: articles/ora_visualisation.html
    github:
      icon: fab fa-github
      href: https://github.com/GregorLueg/bixverse.plots
      aria-label: GitHub

articles:
  - title: Articles
    navbar: Articles
    contents:
      - gsea_visualisation
      - ora_visualisation

reference:
  # Helpers to save various plot types to disk
  - title: Saving plots
    desc: Utilities to save plots to PNG or PDF
    contents:
      - save_plot
      - save_plot_ls
      - params_plots
  # Gene set enrichment plotting
  - title: Gene set enrichment plots
    desc: Utilities to save plots to PNG or PDF
    contents:
      - get_gsea_enrichment_data
      - plot_gse_dotplot
      - plot_gsea_enrichment
      - plot_blitzgsea_null
      - plot_blitzgsea_es_null
  # Enrichment map
  - title: Enrichment map plotting
    desc: Generate enrichment map plots
    contents:
      - enrichment_map_gsea
      - enrichment_map_oae
      - plot_enrichment_map_ggraph
      - plot_enrichment_map_visnetwork
  # Other plots
  - title: Other useful plots
    desc: Other plotting helpers like for volcano plots, etc.
    contents:
      - volcano_plot
      - params_volcano
  # Single cell plotting
  - title: Single cell plotting functions
    desc: Generate different single cell plots
    contents: 
      - violin_plot_sc
      - violin_plot_sc.CellQc
      - violin_plot_sc.data.table
      - density_plot_sc
      - density_plot_sc.CellQc
      - density_plot_sc.data.table
      - joint_plot_sc
      - joint_plot_sc.CellQc
      - joint_plot_sc.data.table
      - dot_plot_sc
      - embedding_plot_sc
      - feature_plot_sc
      - stacked_violin_plot_sc
      - feature_scatter_plot_sc
      - paga_plot_sc
  # Geom extensions
  - title: Geom extensions
    desc: Extensions around the ggplot2 universe
    contents:
      - label_centroids
  # Style
  - title: Bixverse styling options
    desc: Custom ggplot2 styling for Bixverse
    contents:
      - theme_bx
      - scale_fill_bx
      - scale_fill_bx_c
      - scale_color_bx
      - scale_color_bx_c
  # Other utils
  - title: Utility functions
    desc: General utilitys
    contents:
      - wrap_and_truncate
      - prepare_mitch_scores
