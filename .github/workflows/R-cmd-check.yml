name: R-CMD-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: GregorLueg/personal-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # No src/ here, but a rextendr dependency can still fall back to a source
      # build on a platform r-universe has no binary for.
      rust: true
      gpu: false
      windows: true
      linux-runner: ubuntu-latest
      # bixverse and manifoldsR come from here as binaries. This is the only
      # thing resolving them, there is no Remotes fallback.
      extra-repositories: https://gregorlueg.r-universe.dev
    secrets: inherit
